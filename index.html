<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice — Naiteek Choksi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #0f0f0f;
    --muted: #9a9a9a;
    --rule: #e8e8e8;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    padding-top: calc(48px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  }

  .invoice {
    width: 100%;
    max-width: 480px;
  }

  .from {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text);
    margin-bottom: 48px;
  }

  .to-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 4px;
  }

  .to-name {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 56px;
  }

  .amount {
    font-size: clamp(52px, 14vw, 80px);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 56px;
  }

  .amount span {
    font-size: 0.45em;
    font-weight: 400;
    vertical-align: super;
    letter-spacing: 0;
    margin-right: 4px;
    color: var(--muted);
  }

  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin-bottom: 32px;
  }

  .pay-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .upi {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }

  .btn-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .copy-btn, .show-qr-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .copy-btn:hover, .show-qr-btn:hover { color: var(--text); border-color: #ccc; }
  .copy-btn:focus-visible, .show-qr-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Modal backdrop — blurs the invoice behind */
  .qr-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .qr-backdrop.active {
    display: flex;
  }

  /* Modal card */
  .qr-modal {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
    max-width: 320px;
    width: 100%;
  }

  .qr-modal-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  .qr-modal-amount {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.03em;
  }

  .qr-modal-amount span {
    font-size: 0.6em;
    font-weight: 400;
    vertical-align: super;
    color: var(--muted);
    margin-right: 2px;
  }

  .qr-modal canvas, .qr-modal img {
    display: block;
  }

  .qr-modal-upi {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .qr-modal-hint {
    font-size: 11px;
    color: var(--muted);
  }

  .close-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    margin-top: 4px;
    transition: color 0.15s, border-color 0.15s;
  }

  .close-btn:hover { color: var(--text); border-color: #ccc; }
  .close-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .footer {
    margin-top: 56px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .footer a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
  }

  .footer a:hover { border-color: var(--muted); }
</style>
</head>
<body>
<div class="invoice">

  <div class="from">Naiteek Choksi</div>

  <div class="to-label">billed to</div>
  <div class="to-name">Aarosh Clinic</div>

  <div class="amount"><span>₹</span>20,000</div>

  <hr>

  <div class="pay-label">pay via UPI</div>
  <div class="upi">naiteekchoksi@oksbi</div>

  <div class="btn-row">
    <button class="copy-btn" onclick="copyUPI(this)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2H3.5A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      Copy UPI ID
    </button>
    <button class="show-qr-btn" onclick="showQR()">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.4"/>
        <rect x="10" y="1" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.4"/>
        <rect x="1" y="10" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.4"/>
        <rect x="10" y="10" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.4"/>
        <rect x="2.5" y="2.5" width="2" height="2" fill="currentColor"/>
        <rect x="11.5" y="2.5" width="2" height="2" fill="currentColor"/>
        <rect x="2.5" y="11.5" width="2" height="2" fill="currentColor"/>
        <rect x="11.5" y="11.5" width="2" height="2" fill="currentColor"/>
      </svg>
      Show QR
    </button>
  </div>

  <div class="footer">
    <span>Naiteek Choksi</span>
    <a href="https://naiteekchoksi.me" target="_blank" rel="noopener">naiteekchoksi.me</a>
  </div>

</div>

<!-- QR popup with blurred backdrop -->
<div class="qr-backdrop" id="qrBackdrop" onclick="hideQR(event)">
  <div class="qr-modal" onclick="event.stopPropagation()">
    <div class="qr-modal-label">scan to pay</div>
    <div class="qr-modal-amount"><span>₹</span>20,000</div>
    <div id="qrCode"></div>
    <div class="qr-modal-upi">naiteekchoksi@oksbi</div>
    <div class="qr-modal-hint">Scan with any UPI app</div>
    <button class="close-btn" onclick="hideQR(event)">Close</button>
  </div>
</div>

<script>
  const upiUrl = 'upi://pay?pa=naiteekchoksi@oksbi&pn=Naiteek%20Choksi&am=20000&cu=INR';

  (function() {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    script.onload = function() {
      new QRCode(document.getElementById('qrCode'), {
        text: upiUrl,
        width: 200,
        height: 200,
        colorDark: '#0f0f0f',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    };
    document.head.appendChild(script);
  })();

  function showQR() {
    document.getElementById('qrBackdrop').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function hideQR(e) {
    if (e) e.stopPropagation();
    document.getElementById('qrBackdrop').classList.remove('active');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideQR();
  });

  function copyUPI(btn) {
    navigator.clipboard.writeText('naiteekchoksi@oksbi').then(() => {
      btn.textContent = 'Copied';
      setTimeout(() => {
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2H3.5A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" stroke="currentColor" stroke-width="1.4"/></svg> Copy UPI ID`;
      }, 2000);
    });
  }
</script>
</body>
</html>
